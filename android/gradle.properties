# Project-wide Gradle settings, hand-written like the rest of android/. The AGP 8 defaults
# below are spelled out rather than left implicit. See SPEC.md section 8.

# AndroidX package structure. Required by every androidx dependency this project uses.
android.useAndroidX=true

# Each module's R holds only its own ids. Safe: no module here reads another module's R.
android.nonTransitiveRClass=true

# No org.gradle.parallel: on a 16GB machine parallel Kotlin daemons can run out of memory and
# die mid-transform, corrupting the cache. If builds fail opaquely, run `gradlew --stop`.

# Reuse task outputs across builds, so a www-only rebuild doesn't recompile Kotlin/Compose.
org.gradle.caching=true

# Kotlin plus the Compose compiler needs more headroom than the stock 1536m.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
